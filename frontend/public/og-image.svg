<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="50%" stop-color="#1a1c22" />
      <stop offset="100%" stop-color="#0e0f12" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8ff3e" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#d8ff3e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d8ff3e" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Content Container -->
  <g transform="translate(80, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="38" rx="19" fill="#242730" stroke="#373b47" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#d8ff3e" />
    <text x="36" y="24" font-family="'DM Sans', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#d8ff3e" letter-spacing="1">AI DATA STUDIO</text>

    <!-- Brand / Title -->
    <text x="0" y="110" font-family="'DM Sans', -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
      CypherCorp
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="170" font-family="'DM Sans', -apple-system, sans-serif" font-size="28" font-weight="500" fill="#e2e8f0">
      Next-Gen AI Data Intelligence &amp; AutoML Studio
    </text>

    <text x="0" y="220" font-family="'DM Sans', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Automated EDA · Natural Language SQL Analyst · Multi-Model ML Benchmarks
    </text>

    <!-- 3 Core Feature Pill Cards -->
    <g transform="translate(0, 270)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="320" height="130" rx="12" fill="#1b1e26" stroke="#2d323f" stroke-width="1" filter="url(#shadow)" />
      <text x="24" y="42" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700" fill="#d8ff3e">📊 Automated EDA</text>
      <text x="24" y="72" font-family="'DM Sans', sans-serif" font-size="14" fill="#94a3b8">Instant statistical profiling,</text>
      <text x="24" y="94" font-family="'DM Sans', sans-serif" font-size="14" fill="#94a3b8">correlations &amp; IQR health scores</text>

      <!-- Card 2 -->
      <rect x="340" y="0" width="320" height="130" rx="12" fill="#1b1e26" stroke="#2d323f" stroke-width="1" filter="url(#shadow)" />
      <text x="364" y="42" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700" fill="#38bdf8">💬 Natural Language SQL</text>
      <text x="364" y="72" font-family="'DM Sans', sans-serif" font-size="14" fill="#94a3b8">Ask plain English questions,</text>
      <text x="364" y="94" font-family="'DM Sans', sans-serif" font-size="14" fill="#94a3b8">get zero-hallucination queries</text>

      <!-- Card 3 -->
      <rect x="680" y="0" width="320" height="130" rx="12" fill="#1b1e26" stroke="#2d323f" stroke-width="1" filter="url(#shadow)" />
      <text x="704" y="42" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700" fill="#a855f7">⚡ AutoML Studio</text>
      <text x="704" y="72" font-family="'DM Sans', sans-serif" font-size="14" fill="#94a3b8">Train &amp; benchmark models,</text>
      <text x="704" y="94" font-family="'DM Sans', sans-serif" font-size="14" fill="#94a3b8">live real-time sandbox inference</text>
    </g>

    <!-- Footer URL -->
    <g transform="translate(0, 440)">
      <text x="0" y="24" font-family="'DM Mono', monospace" font-size="16" font-weight="500" fill="#64748b">https://cyphercorp.com</text>
      <text x="800" y="24" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#64748b">Enterprise Tenant Isolated Workspace</text>
    </g>
  </g>
</svg>
